global:
  scrape_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: knowledge-api
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
