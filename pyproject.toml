[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kms"
version = "0.1.0"
description = "授权合规知识管理服务（LightRAG 1.5.7 + PostgreSQL 18 + pgvector 0.8.7）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "lightrag-hku==1.5.7",
    "asyncpg>=0.30",
    "pgvector>=0.4",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "prometheus-client>=0.21",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]
langfuse = ["langfuse>=3.0"]

[project.scripts]
ics-knowledge = "kms.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "B017"]
"scripts/**" = ["S101", "S108", "S311", "S603"]
"eval/**" = ["S101"]
"src/kms/authority/schema.py" = ["S105"]
"src/kms/publish/graph_scope.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "m0: M0 探测与基线",
    "m1: M1 路由与后端",
    "m2: M2 权威层与字典",
    "m3: M3 分块两表与正文闸",
    "m4: M4 候选闸",
    "m5: M5 发布闭环",
    "m6: M6 查询路径与 L2",
    "m7: M7 可观测、对账与 CI",
    "m7a: M7a 离线评测",
    "m7b: M7b 遥测管道",
    "m8: M8 规模评估",
    "db: 需要真实 PostgreSQL 实例",
]

[tool.coverage.run]
branch = true
source = ["kms"]

[tool.coverage.report]
fail_under = 85
show_missing = true
