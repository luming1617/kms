name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ics
          POSTGRES_PASSWORD: ics
          POSTGRES_DB: ics
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U ics -d ics"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,otel]"
      - run: bash ci/ci.sh
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5434"
          POSTGRES_USER: ics
          POSTGRES_PASSWORD: ics
          POSTGRES_DATABASE: ics
